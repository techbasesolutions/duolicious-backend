# nginx config for 167-71-93-27.sslip.io
#
# Routes:
#   /chat-ws  → ws://127.0.0.1:5443 (chat container's WebSocket port)
#               with the Connection/Upgrade headers required by ejabberd.
#   /         → http://127.0.0.1:5000 (API container) — bonus: lets us
#               also use this hostname as the REST API endpoint, so the
#               frontend can drop the /api Next.js proxy later if we want.
#
# certbot --nginx adds the listen 443 ssl + ssl_certificate directives
# automatically; we keep a minimal HTTP-only block here for the initial
# install + ACME challenge. After cert issuance, certbot rewrites this
# file into the HTTPS form.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 167-71-93-27.sslip.io;

    # Reasonable max for image uploads (base64 photos) — the API limit
    # is enforced by uvicorn but nginx must not be smaller.
    client_max_body_size 20m;

    # WebSocket: ahavah-api-chat-1 exposes 5443. The chat client SASL-binds
    # then exchanges XMPP-XML stanzas; long-lived connections need a long
    # read timeout (default 60s would drop idle chats).
    location /chat-ws {
        proxy_pass http://127.0.0.1:5443/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 1 hour idle keepalive — covers active conversations without
        # making nginx hold sockets forever for ghost clients.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
