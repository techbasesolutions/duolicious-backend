on:
  push:
    branches:
      - main
  # Note: pull_request from forks runs the PR's docker build with no
  # access to repo secrets (workflow uses inline fake values). Fork PRs
  # CAN still consume CI minutes by running arbitrary code inside the
  # docker build context. The repo's Settings → Actions → "Fork pull
  # request workflows from outside collaborators" SHOULD be set to
  # "Require approval for first-time contributors" (audit Infra #7).
  # That gating lives in repo settings, not this file.
  pull_request:
    branches:
      - main

# Test runner needs read-only access to source. No write actions.
permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.x
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.x
      with:
        python-version: '3.12'
    - run: ./mypy.sh

  functionality-tests-1:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3.6.0

      - name: Run functionality tests
        run: ./test/util/with-container.sh ./test/functionality.sh 1
        env:
          DUO_EMAIL_KEY: 'not-a-real-key'
          DUO_EMAIL_URL: 'https://example.com'

          DUO_R2_BUCKET_NAME: s3-mock-bucket
          DUO_R2_ACCT_ID: unused-in-dev-env
          DUO_R2_ACCESS_KEY_ID: s3-mock-access-key-id
          DUO_R2_ACCESS_KEY_SECRET: s3-mock-secret-access-key-secret

  functionality-tests-2:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3.6.0

