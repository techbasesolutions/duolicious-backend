# Ahavah fork note: this fork deploys to the DigitalOcean droplet via
# deploy-ahavah.yml, NOT to Google Artifact Registry. The upstream Duolicious
# GCP publish below has no GCP_CREDENTIALS / GCP_PROJECT_ID secrets in this repo,
# so it failed on every push and sent failure emails. Set to manual-only to stop
# that; it can still be run by hand from the Actions tab if ever needed.
on: workflow_dispatch

# Defensive — workflow is manual-only and unused, but lock the token anyway.
permissions:
  contents: read

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - id: get_branch
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - id: set_image_name
        run: echo "IMAGE_NAME=us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/api/${BRANCH}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:$GITHUB_SHA -f api.Dockerfile .

      - name: Push Docker Image to Google Artifact Registry
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev
          docker push $IMAGE_NAME:$GITHUB_SHA

  build-chat:
